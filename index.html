<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

html,body{

margin:0;
padding:0;

background:transparent;

overflow:hidden;

}


img{

width:100%;

display:block;


opacity:0;


animation:

show 5s ease forwards;

}



@keyframes show{


0%{

opacity:0;

transform:translateY(20px);

}


100%{

opacity:1;

transform:translateY(0);

}


}


</style>

</head>



<body>


<img src="chart.png">


</body>


</html>
