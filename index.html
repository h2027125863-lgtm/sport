<!DOCTYPE html>

<style>

html,body{

margin:0;

svg{

width:100%;
height:100%;

}


/* 线条动画 */

.line{

stroke:#9bc7a6;
stroke-width:1.5;
fill:none;
opacity:0.5;

stroke-dasharray:300;
stroke-dashoffset:300;

animation:draw 8s linear infinite;

}


@keyframes draw{

0%{

stroke-dashoffset:300;
opacity:0;

}


30%{

opacity:0.6;

}


100%{

stroke-dashoffset:0;
opacity:0.2;

}

}



/* 数据点 */

.dot{

fill:#8fc49b;

animation:float 5s infinite ease-in-out;

}


@keyframes float{


0%,100%{

transform:translateY(0);

opacity:0.4;

}


50%{

transform:translateY(-15px);

opacity:0.9;

}


}


</style>


</head>
